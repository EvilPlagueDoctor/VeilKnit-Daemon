# Test bench: the daemon as a plain binary, no library, no JNI, no API link.
#
# Derived from the Android manifest, which is the tree that is actually current - the Linux
# tree is behind by five API actions and assorted module drift. Removed: [lib]/cdylib, the
# android-only jni target, and the workspace members that live in the daemon tree.
#
# Added: ctrlc, for the desktop equivalent of the foreground service's stop request.

[package]
name = "veilknit_bench"
version = "0.2.0"
edition = "2021"

[[bin]]
name = "veilknit_bench"
path = "src/main.rs"

[features]
# console-ui on by default here. The Android build leaves it off because Kotlin draws the UI;
# on a bench the console IS the UI.
default = ["console-ui"]
console-ui = ["dep:crossterm"]

[dependencies]
tokio = { version = "1", features = ["full"] }
ctrlc = "3.4"
flume = "0.12"
serde_json = "1.0"
veilid-core = { git = "https://gitlab.com/veilid/veilid.git", branch = "0.5.7-debug" }
base64 = "0.21"
anyhow = "1.0"

arc-swap = "1"
futures = "0.3"

argon2 = "0.5"
bincode = "1.3"
hex = "0.4"

serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
hmac = "0.12"
uuid = { version = "1", features = ["v4"] }

zeroize = "1"
aes-gcm = "0.10"
blake3 = "1"
ed25519-dalek = { version = "2", features = ["rand_core", "serde"] }

x25519-dalek = { version = "2", features = ["static_secrets"] }
rand_core = "0.6"
rand = "0.8"

crossterm = { version = "0.28", optional = true }

# Own workspace root, so cargo does not walk upward looking for a parent.
[workspace]

[profile.release]
opt-level = 3
debug = 0
lto = "thin"
codegen-units = 1
# NOT panic = "abort", unlike the daemon's release profile. With abort, a panicking shutdown
# hook kills the process before the coordinator can record it, which makes the panic scenario
# meaningless and hides the same class of fault in a real run.
panic = "unwind"
