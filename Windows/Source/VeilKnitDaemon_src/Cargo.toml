# VeilKnit Node - Windows network backend.
#
# The Windows release uses crates.io Veilid 0.5.7. Android intentionally remains on the
# 0.5.7-debug git branch because that branch contains the mobile-data networking fix.

[package]
name = "veilknit_node"
version = "0.2.0"
edition = "2021"

[[bin]]
name = "VeilKnitNode"
path = "src/main.rs"

[features]
# console-ui is enabled by default for the standalone Windows node. The GUI normally starts
# this backend hidden, while direct launches retain the administration console.
default = ["console-ui"]
console-ui = ["dep:crossterm"]

[dependencies]
tokio = { version = "1", features = ["full"] }
ctrlc = "3.4"
flume = "0.12"
serde_json = "1.0"
veilid-core = "0.5.7"
base64 = "0.21"
anyhow = "1.0"

arc-swap = "1"
futures = "0.3"

argon2 = "0.5"
bincode = "1.3"
hex = "0.4"

serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
hmac = "0.12"
uuid = { version = "1", features = ["v4"] }

zeroize = "1"
aes-gcm = "0.10"
blake3 = "1"
unicode-normalization = "0.1"
unicode-segmentation = "1"
deunicode = "1"
ed25519-dalek = { version = "2", features = ["rand_core", "serde"] }

x25519-dalek = { version = "2", features = ["static_secrets"] }
rand_core = "0.6"
rand = "0.8"

crossterm = { version = "0.28", optional = true }

# Own workspace root, so cargo does not walk upward looking for a parent.
[workspace]

[profile.release]
opt-level = 3
debug = 0
lto = "thin"
codegen-units = 1
# Keep unwind semantics so the lifecycle coordinator can record a panicking shutdown hook
# instead of losing the diagnostic state to an immediate process abort.
panic = "unwind"
